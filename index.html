<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Körkortsträning B</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:700px;margin:auto;padding:28px 18px;min-height:100vh}.card{background:#151c25;border:1px solid #2a3544;border-radius:22px;padding:20px}h1{font-size:28px}.muted{color:#9eabba;line-height:1.45}.modes{display:flex;gap:8px;margin:18px 0}.modes button{flex:1}.btn,.ans{border:1px solid #2a3544;border-radius:15px;padding:15px;background:#1c2531;color:#fff;font-size:16px}.btn{width:100%;font-weight:700}.primary{background:#5f8dff;border:0}.on{outline:2px solid #5f8dff}.ans{width:100%;text-align:left;margin:6px 0}.good{background:#123328;border-color:#36c78b}.bad{background:#35191e;border-color:#ff5c68}.hidden{display:none}.top{display:flex;justify-content:space-between;color:#9eabba;font-size:13px}.q{font-size:22px;font-weight:750;line-height:1.3;margin:20px 0}.feedback{padding:14px;margin-top:12px;border-radius:14px;background:#1c2531;line-height:1.4}.stats{display:flex;gap:8px;margin:12px 0}.stat{flex:1;text-align:center;background:#1c2531;padding:10px;border-radius:12px}.bar{height:7px;background:#25303e;border-radius:9px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;background:#5f8dff}.timer{font-weight:700}</style></head><body><main class="app"><section id="home"><h1>Körkortsträning B</h1><p class="muted">Mobilanpassad träning. Fel frågor återkommer tills du svarar rätt.</p><div class="card"><div class="modes"><button id="train" class="btn on">Träningsläge</button><button id="exam" class="btn">Provpass 70 frågor</button></div><button id="start" class="btn primary">Starta</button><p class="muted">Egenproducerade övningsfrågor. Resultat sparas lokalt på telefonen.</p></div></section><section id="quiz" class="hidden"><div class="top"><span id="cat"></span><span><span id="count"></span> <span id="timer" class="timer"></span></span></div><div class="bar"><i id="bar"></i></div><div class="card"><div class="stats"><div class="stat">Rätt<br><b id="r">0</b></div><div class="stat">Fel<br><b id="w">0</b></div><div class="stat">Kvar<br><b id="left">0</b></div></div><div id="q" class="q"></div><div id="answers"></div><div id="fb" class="feedback hidden"></div><button id="next" class="btn primary hidden" style="margin-top:12px">Nästa</button></div></section><section id="done" class="hidden"><h1>Passet klart</h1><div class="card"><p id="result"></p><button class="btn primary" onclick="location.reload()">Nytt pass</button></div></section></main><script>
const B=[
["Fordonskännedom","Vad händer ungefär med bromssträckan om hastigheten fördubblas?",["Den dubbleras","Den tredubblas","Den fyrdubblas","Den ändras inte"],2,"Bromssträckan ökar ungefär med hastigheten i kvadrat."],
["Fordonskännedom","Vad är ABS-systemets huvuduppgift vid hård bromsning?",["Öka motoreffekten","Motverka hjullåsning","Öka däcktrycket","Koppla ur styrningen"],1,"ABS motverkar hjullåsning och hjälper dig behålla styrförmågan."],
["Fordonskännedom","Vad kan för lågt däcktryck orsaka?",["Sämre köregenskaper och högre förbrukning","Alltid bättre grepp","Kortare reaktionstid","Lägre vikt"],0,"Fel däcktryck kan försämra stabilitet och öka rullmotståndet."],
["Fordonskännedom","Vad bör du göra vid vattenplaning?",["Bromsa maximalt","Gasa","Släppa gasen och undvika häftiga manövrer","Rycka i ratten"],2,"Minska farten mjukt tills däcken åter får kontakt med vägen."],
["Fordonskännedom","Varför ska tung last placeras lågt och säkras?",["För stabilitet och för att hindra förskjutning","För högre motoreffekt","För kortare reaktionstid","För att stänga av ABS"],0,"Lastens placering påverkar bilens stabilitet."],
["Miljö","Vilket körsätt minskar normalt bränsleförbrukningen?",["Jämn fart och framförhållning","Hårda accelerationer","Onödig tomgång","Alltid låg växel"],0,"Jämn körning och framförhållning minskar onödig energianvändning."],
["Miljö","Hur påverkar takbox normalt förbrukningen?",["Den kan öka den","Den halverar den","Ingen påverkan","Den gör bilen utsläppsfri"],0,"Ökat luftmotstånd kan höja energiförbrukningen."],
["Miljö","Hur påverkar onödig extra vikt bilen?",["Kan öka förbrukningen","Minskar alltid förbrukningen","Ingen påverkan","Ökar däckens livslängd"],0,"Mer massa kräver mer energi, särskilt vid acceleration."],
["Miljö","Vad är bäst för en mycket kort resa när det är praktiskt möjligt?",["Gå eller cykla","Köra bilen kall","Låta bilen gå på tomgång först","Ta en omväg"],0,"Gång och cykel ger inga avgasutsläpp från bilresan."],
["Trafiksäkerhet","Vad bör du göra i tät dimma?",["Sänka farten och öka avståndet","Köra fortare","Köra nära framförvarande","Släcka belysningen"],0,"Sikten är begränsad och kräver större säkerhetsmarginal."],
["Trafiksäkerhet","Vad gör du om du blir mycket trött under körning?",["Stannar lämpligt och vilar","Öppnar fönstret och fortsätter","Kör fortare","Höjer musiken"],0,"Allvarlig trötthet kräver vila."],
["Trafiksäkerhet","Varför är kort avstånd till framförvarande farligt?",["Mindre tid att reagera","Bättre sikt","Kortare bromssträcka","Bättre grepp"],0,"Kort avstånd minskar säkerhetsmarginalen."],
["Trafiksäkerhet","Vad bör du tänka på nära en skola?",["Barn kan agera oväntat","Barn har alltid perfekt uppsikt","Hastigheten saknar betydelse","Tuta kontinuerligt"],0,"Barn kan vara svåra att upptäcka och agera oväntat."],
["Trafikregler","Vad innebär stopplikt?",["Du måste stanna och sedan lämna företräde enligt reglerna","Du behöver bara sakta ner","Du får köra om ingen syns","Den gäller bara lastbilar"],0,"Vid stopplikt ska fordonet stannas."],
["Trafikregler","Vad innebär väjningsplikt?",["Du ska tydligt visa att du tänker lämna företräde","Du har alltid företräde","Du måste alltid stanna helt","Den gäller bara i mörker"],0,"Du ska anpassa körningen så att annan trafik inte behöver bromsa eller väja på grund av dig."],
["Trafikregler","Vad gäller när polisens tecken strider mot ett trafikljus?",["Polisens tecken gäller","Trafikljuset gäller","Högerregeln gäller alltid","Du väljer själv"],0,"Polismans anvisning har företräde."],
["Trafikregler","Ger blinkers dig automatiskt företräde?",["Nej","Ja","Bara i rondell","Bara på motorväg"],0,"Blinkers visar avsikt men ändrar inte väjningsregler."],
["Trafikregler","Får du överskrida hastighetsgränsen vid omkörning?",["Nej","Ja med 20 km/h","Ja om vägen är rak","Ja om bilen framför kör långsamt"],0,"Hastighetsgränsen gäller även vid omkörning."],
["Trafikregler","Vad gäller när du kör ut från en parkeringsplats?",["Du har väjningsplikt mot trafiken du kör in på","Högerregeln ger dig företräde","Du har alltid företräde","Endast gående behöver beaktas"],0,"Utfartsregeln innebär att du ska lämna företräde."],
["Personliga förutsättningar","Hur påverkar alkohol normalt körförmågan?",["Omdöme och reaktion försämras","Reaktionen blir alltid snabbare","Mörkerseendet förbättras","Riskbedömningen blir säkrare"],0,"Alkohol kan försämra omdöme, uppmärksamhet och reaktionsförmåga."],
["Personliga förutsättningar","Vad gör du om ett läkemedel gör dig dåsig?",["Avstår från körning och kontrollerar trafikvarningen","Kör fortare","Dricker kaffe och kör ändå","Undviker bara motorväg"],0,"Dåsighet kan göra körning osäker."],
["Trafiksäkerhet","Vad bör du göra vid kraftigt regn?",["Minska hastigheten och öka avståndet","Öka hastigheten","Köra närmare framförvarande","Släcka belysningen"],0,"Regn försämrar sikt och väggrepp."],
["Trafikregler","Du har grönt men korsningen är blockerad. Vad gör du?",["Väntar tills du kan passera utan att blockera","Kör in ändå","Tutar","Kör upp på gångbanan"],0,"Du ska inte köra in så att korsande trafik blockeras."],
["Fordonskännedom","Vad händer med belastningen vid kraftig bromsning?",["Mer flyttas mot framhjulen","Mer flyttas bakåt","All belastning försvinner","Ingenting"],0,"Vid inbromsning sker dynamisk tyngdöverföring framåt."],
["Trafikregler","Vad är grundprincipen före en omkörning?",["Säkerställ att den kan ske utan fara och med utrymme","Börja köra om först","Ligg mycket nära","Kör alltid om långsamma fordon"],0,"Omkörning kräver sikt, marginal och kontroll över övrig trafik."]
];
let mode="train",Q=[],cur,r=0,w=0,total=0,answers=0,tick=null,sec=3000;
const $=x=>document.getElementById(x),mix=a=>a.sort(()=>Math.random()-.5);
train.onclick=()=>{mode="train";train.classList.add("on");exam.classList.remove("on")};exam.onclick=()=>{mode="exam";exam.classList.add("on");train.classList.remove("on")};
start.onclick=()=>{home.classList.add("hidden");quiz.classList.remove("hidden");r=w=answers=0;if(mode==="train"){Q=mix([...Array(B.length).keys()]);total=B.length}else{Q=[];while(Q.length<70)Q.push(...mix([...Array(B.length).keys()]));Q=Q.slice(0,70);total=70;sec=3000;timer.textContent="50:00";tick=setInterval(()=>{sec--;timer.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec<=0)finish()},1000)};nextQ()};
function nextQ(){if(!Q.length)return finish();let i=Q.shift(),x=B[i];cur={i,x};cat.textContent=x[0];q.textContent=x[1];answersEl=$("answers");answersEl.innerHTML="";fb.classList.add("hidden");next.classList.add("hidden");count.textContent=mode==="exam"?"Fråga "+(answers+1)+"/70":r+"/"+total+" klara";bar.style.width=(mode==="exam"?answers/70:r/total)*100+"%";left.textContent=Q.length+1;x[2].forEach((t,j)=>{let b=document.createElement("button");b.className="ans";b.textContent=t;b.onclick=()=>pick(j,b);answersEl.appendChild(b)})}
function pick(j,b){let x=cur.x,ok=j===x[3];[...$("answers").children].forEach(z=>z.disabled=true);answers++;if(ok){r++;b.classList.add("good")}else{w++;b.classList.add("bad");$("answers").children[x[3]].classList.add("good");if(mode==="train")Q.splice(Math.min(Q.length,5+Math.floor(Math.random()*8)),0,cur.i)};$("r").textContent=r;$("w").textContent=w;$("left").textContent=Q.length;if(mode==="exam"){nextQ();return}fb.textContent=(ok?"Rätt. ":"Fel. Frågan kommer tillbaka. ")+x[4];fb.classList.remove("hidden");next.classList.remove("hidden");next.onclick=nextQ}
function finish(){if(tick)clearInterval(tick);quiz.classList.add("hidden");done.classList.remove("hidden");result.textContent=mode==="exam"?r+" rätt av 70 träningsfrågor.":("Alla "+total+" frågor besvarade rätt. Du hade "+w+" felsvar under passet.");localStorage.setItem("lastScore",JSON.stringify({r,w,date:Date.now()}))}
</script></body></html>
